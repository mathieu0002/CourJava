spring.application.name=td2biblio

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.locations=classpath:/db/migration
spring.flyway.schemas=biblio
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/TD2Java?currentSchema=biblio
spring.datasource.username=postgres
spring.datasource.password=postgres

# Logging configuration
logging.file.name=logs/td2biblio.log
logging.level.root=INFO
logging.level.com.usmb.but3.td3biblio=DEBUG
# Tracer dans la console les requêtes SQL effectuées par Hibernate :
spring.jpa.properties.hibernate.show_sql:true
spring.jpa.properties.hibernate.logs:true